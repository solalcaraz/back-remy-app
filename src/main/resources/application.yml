server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  application:
    name: back-remy-app
  datasource:
    url: jdbc:postgresql://localhost:5434/remy-app
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    create-schemas: false
    locations: classpath:db/migration
  web:
    error:
      include-message: always
      whitelabel:
        enabled: false
app:
  base-url: http://localhost:8080

security:
  key: "tu-clave-secreta-super-segura-de-al-menos-256-bits-o-32-caracteres"
  access-token-expiration: 600000000
  refresh-token-expiration: 604800000
