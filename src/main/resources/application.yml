server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  application:
    name: back-remy-app
  datasource:
    url: jdbc:postgresql://localhost:5434/remy-app
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  web:
    error:
      include-message: always
      whitelabel:
        enabled: false
app:
  base-url: http://localhost:8080