server:
  port: 8080
  error:
    include-message: always
    whitelabel:
      enabled: false
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  application:
    name: back-remy-app
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/remy-app}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    create-schemas: false
    locations: classpath:db/migration
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  upload-root: ${APP_UPLOAD_ROOT:uploads}
  upload-dir: ${APP_UPLOAD_DIR:uploads/usuarios}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

security:
  key: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:600000000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
