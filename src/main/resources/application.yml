server:
  port: 8080

spring:
  application:
    name: back-remy-app
  datasource:
    url: jdbc:postgresql://localhost:5434/remy-app
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  web:
    error:
      include-message: always
      whitelabel:
        enabled: false

security:
  key: "tu-clave-secreta-super-segura-de-al-menos-256-bits-o-32-caracteres"
  access-token-expiration: 60000
  refresh-token-expiration: 604800000
